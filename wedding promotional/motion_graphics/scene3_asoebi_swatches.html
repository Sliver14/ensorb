<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scene 3: Aso Ebi Color Guide - Keep Everyone in Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050406;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .scene-container {
      position: relative;
      width: 100vw;
      max-width: 540px;
      height: 100vh;
      max-height: 960px;
      aspect-ratio: 9 / 16;
      background: radial-gradient(circle at 50% 20%, #201018 0%, #0d080c 50%, #050305 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 44px 20px 36px;
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9);
    }

    /* Ambient lighting */
    .ambient-glow {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(162, 28, 62, 0.25) 0%, rgba(96, 108, 56, 0.15) 50%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
    }

    /* Top Title Badge */
    .header-box {
      position: relative;
      z-index: 10;
      text-align: center;
      margin-bottom: 12px;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #E2E8F0;
      margin-bottom: 8px;
    }

    .headline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 30px;
      font-weight: 700;
      background: linear-gradient(135deg, #FFFFFF 0%, #FCE7F3 60%, #F472B6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.01em;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
    }

    /* Animated Swatch Bar */
    .swatches-strip {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
      margin-bottom: 16px;
    }

    .swatch-card {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 6px 10px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      animation: swatchBounce 3s ease-in-out infinite alternate;
    }

    .swatch-circle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .swatch-name {
      font-size: 11px;
      font-weight: 600;
      color: #F1F5F9;
      letter-spacing: 0.02em;
    }

    /* Central Phone Mockup showcasing Real Footage */
    .phone-container {
      position: relative;
      z-index: 5;
      width: 250px;
      height: 510px;
      background: #09090b;
      border: 3.5px solid #27272a;
      border-radius: 34px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.85), 0 0 40px rgba(162, 28, 62, 0.2);
      overflow: hidden;
    }

    .phone-notch {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 14px;
      background: #000;
      border-radius: 12px;
      z-index: 10;
    }

    .phone-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Bottom Supporting Tag */
    .bottom-tag {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 999px;
    }

    @keyframes swatchBounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>

  <div class="scene-container">
    <div class="ambient-glow"></div>

    <!-- Header Box -->
    <div class="header-box">
      <div class="category-badge">
        <span>👗</span> Guest Fashion & Style
      </div>
      <h1 class="headline">Keep Everyone in Style</h1>
    </div>

    <!-- Real Swatches -->
    <div class="swatches-strip">
      <div class="swatch-card" style="animation-delay: 0s;">
        <div class="swatch-circle" style="background: #722F37;"></div>
        <span class="swatch-name">Burgundy</span>
      </div>
      <div class="swatch-card" style="animation-delay: 0.3s;">
        <div class="swatch-circle" style="background: #E8C5C8;"></div>
        <span class="swatch-name">Blush Pink</span>
      </div>
      <div class="swatch-card" style="animation-delay: 0.6s;">
        <div class="swatch-circle" style="background: #A8C3B1;"></div>
        <span class="swatch-name">Mint</span>
      </div>
      <div class="swatch-card" style="animation-delay: 0.9s;">
        <div class="swatch-circle" style="background: #606C38;"></div>
        <span class="swatch-name">Olive</span>
      </div>
    </div>

    <!-- Phone Mockup with Actual Screen Recording -->
    <div class="phone-container">
      <div class="phone-notch"></div>
      <video class="phone-video" src="../screen_recordings/scene3_asoebi_guide.mp4" autoplay loop muted playsinline></video>
    </div>

    <!-- Bottom Tag -->
    <div class="bottom-tag">
      <span>✨</span> Complete Fabric Guide & WhatsApp Coordination
    </div>
  </div>

</body>
</html>
