<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InsightNovaTech - Animated Logo Reveal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #060309;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      perspective: 1200px;
    }

    /* 9:16 Vertical Container for Reels/Shorts/TikTok */
    .viewport-container {
      position: relative;
      width: 100vw;
      max-width: 540px;
      height: 100vh;
      max-height: 960px;
      aspect-ratio: 9 / 16;
      background: radial-gradient(circle at 50% 38%, #1f0b2d 0%, #0d0413 55%, #050108 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 100px rgba(147, 51, 234, 0.15);
      border-radius: 20px;
    }

    @media (min-aspect-ratio: 9/16) {
      .viewport-container {
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    }

    /* Ambient Background Effects */
    .ambient-glow {
      position: absolute;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, rgba(126, 34, 206, 0.15) 40%, transparent 70%);
      border-radius: 50%;
      top: 26%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(50px);
      animation: pulseGlow 5s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .ambient-glow-blush {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(244, 114, 182, 0.22) 0%, transparent 70%);
      border-radius: 50%;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(40px);
      animation: pulseGlow 6s ease-in-out infinite alternate-reverse;
      pointer-events: none;
    }

    /* Particle Canvas */
    #particle-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Lighting Ring */
    .lighting-ring {
      position: absolute;
      top: 36%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 340px;
      height: 340px;
      border-radius: 50%;
      border: 1px solid rgba(216, 180, 254, 0.15);
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.2), inset 0 0 30px rgba(192, 132, 252, 0.15);
      animation: rotateRing 20s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    .lighting-ring::after {
      content: '';
      position: absolute;
      top: -3px;
      left: 50%;
      width: 6px;
      height: 6px;
      background: #E9D5FF;
      border-radius: 50%;
      box-shadow: 0 0 12px 3px #C084FC;
    }

    /* Main Showcase Content */
    .content-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 90%;
      max-width: 440px;
    }

    /* Logo Holder with 3D Float and Reveal */
    .logo-container {
      position: relative;
      width: 200px;
      height: 140px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      animation: logoFloat 4.5s ease-in-out infinite, logoReveal 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .logo-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 15px 35px rgba(147, 51, 234, 0.55)) drop-shadow(0 0 18px rgba(192, 132, 252, 0.4));
      position: relative;
      z-index: 3;
    }

    /* Light Sweep Shimmer */
    .shimmer-sweep {
      position: absolute;
      top: -20%;
      left: -50%;
      width: 200%;
      height: 140%;
      background: linear-gradient(
        105deg,
        transparent 35%,
        rgba(255, 255, 255, 0.15) 45%,
        rgba(255, 255, 255, 0.5) 50%,
        rgba(255, 255, 255, 0.15) 55%,
        transparent 65%
      );
      mix-blend-mode: overlay;
      pointer-events: none;
      animation: sweepLight 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      z-index: 4;
    }

    /* Typography */
    .brand-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #FFFFFF 0%, #F3E8FF 50%, #C084FC 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeUp 1s ease-out 0.6s forwards;
      filter: drop-shadow(0 2px 10px rgba(168, 85, 247, 0.3));
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #E9D5FF;
      background: rgba(147, 51, 234, 0.18);
      border: 1px solid rgba(192, 132, 252, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 30px;
      opacity: 0;
      animation: fadeUp 1s ease-out 0.9s forwards;
    }

    .brand-badge-dot {
      width: 6px;
      height: 6px;
      background: #A855F7;
      border-radius: 50%;
      box-shadow: 0 0 8px #A855F7;
    }

    /* Divider Line */
    .divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #C084FC, transparent);
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeUp 1s ease-out 1.1s forwards;
    }

    /* Primary Question Headline */
    .cta-question {
      font-family: 'Playfair Display', 'Cormorant Garamond', Georgia, serif;
      font-size: 27px;
      line-height: 1.3;
      font-weight: 600;
      color: #FFFFFF;
      margin-bottom: 14px;
      opacity: 0;
      animation: fadeUp 1s ease-out 1.3s forwards;
    }

    .cta-question em {
      font-style: italic;
      color: #E9D5FF;
    }

    /* Services List */
    .services-tagline {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #D8B4FE;
      line-height: 1.6;
      margin-bottom: 22px;
      opacity: 0;
      animation: fadeUp 1s ease-out 1.5s forwards;
    }

    .services-tagline span {
      display: inline-block;
      margin: 0 4px;
      color: rgba(216, 180, 254, 0.4);
    }

    /* Tagline Highlight */
    .tagline-exceptional {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #F472B6, #C084FC, #60A5FA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 30px;
      opacity: 0;
      animation: fadeUp 1s ease-out 1.7s forwards;
    }

    /* Call to Action Button */
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #060309;
      background: linear-gradient(135deg, #F3E8FF 0%, #D8B4FE 50%, #C084FC 100%);
      padding: 13px 28px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4), 0 0 20px rgba(192, 132, 252, 0.3);
      opacity: 0;
      animation: fadeUp 1s ease-out 1.9s forwards, btnGlow 3s ease-in-out infinite 2.5s;
    }

    .cta-btn svg {
      width: 15px;
      height: 15px;
      stroke: #060309;
      stroke-width: 2.4;
      fill: none;
      transition: transform 0.2s;
    }

    /* Keyframes */
    @keyframes logoReveal {
      0% {
        opacity: 0;
        transform: scale(0.65) translateY(30px) rotateX(15deg);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0) rotateX(0deg);
        filter: blur(0);
      }
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0px) rotateX(0deg) rotateY(0deg);
      }
      50% {
        transform: translateY(-8px) rotateX(4deg) rotateY(-4deg);
      }
    }

    @keyframes sweepLight {
      0% {
        transform: translateX(-100%);
      }
      30%, 100% {
        transform: translateX(100%);
      }
    }

    @keyframes pulseGlow {
      0% {
        opacity: 0.6;
        transform: translate(-50%, -50%) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.15);
      }
    }

    @keyframes rotateRing {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(18px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes btnGlow {
      0%, 100% {
        box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4), 0 0 20px rgba(192, 132, 252, 0.3);
      }
      50% {
        box-shadow: 0 12px 35px rgba(168, 85, 247, 0.7), 0 0 35px rgba(192, 132, 252, 0.6);
      }
    }

    /* Floating Control Bar for Preview */
    .controls-bar {
      position: absolute;
      bottom: 14px;
      z-index: 20;
      display: flex;
      gap: 10px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: 0.2s;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <div class="viewport-container" id="container">
    <!-- Ambient Radial Glows -->
    <div class="ambient-glow"></div>
    <div class="ambient-glow-blush"></div>
    <div class="lighting-ring"></div>

    <!-- Particle Starfield / Ambient Sparkles -->
    <canvas id="particle-canvas"></canvas>

    <!-- Content -->
    <div class="content-wrapper">
      <!-- 3D Floating Logo -->
      <div class="logo-container">
        <div class="shimmer-sweep"></div>
        <img 
          src="../Gemini_Generated_Image_ssnwfissnwfissnw-Photoroom.png" 
          alt="InsightNovaTech Monogram" 
          class="logo-image"
          id="brandLogo"
        >
      </div>

      <!-- Brand Identity -->
      <h1 class="brand-title">InsightNovaTech</h1>
      <div class="brand-badge">
        <span class="brand-badge-dot"></span>
        Digital Solutions & Software
      </div>

      <div class="divider"></div>

      <!-- Final Scene 7 Script Hook -->
      <h2 class="cta-question">
        Need a Website Built Around <em>Your Vision?</em>
      </h2>

      <!-- Services -->
      <p class="services-tagline">
        Custom Websites <span>•</span> Web Applications <span>•</span> Digital Experiences
      </p>

      <!-- Tagline -->
      <div class="tagline-exceptional">
        Let’s Build Something Exceptional.
      </div>

      <!-- Action Button -->
      <a href="#" class="cta-btn" onclick="return false;">
        Send Us a Message Today
        <svg viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>

    <!-- Controls -->
    <div class="controls-bar">
      <button class="ctrl-btn" onclick="restartAnimation()">↺ Replay Reveal</button>
    </div>
  </div>

  <script>
    // Star & Sparkle Dust Particle System
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.6;
        this.speedY = -(Math.random() * 0.4 + 0.1);
        this.speedX = (Math.random() - 0.5) * 0.2;
        this.opacity = Math.random() * 0.7 + 0.2;
        this.fadeSpeed = Math.random() * 0.008 + 0.003;
        this.hue = Math.random() > 0.4 ? 275 : 325; // Purple & Blush Pink
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.opacity -= this.fadeSpeed;
        if (this.y < 0 || this.opacity <= 0) {
          this.reset();
          this.y = canvas.height + 10;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 85%, 75%, ${this.opacity})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = `hsla(${this.hue}, 90%, 65%, ${this.opacity})`;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    for (let i = 0; i < 45; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();

    function restartAnimation() {
      const container = document.getElementById('container');
      const clone = container.cloneNode(true);
      container.parentNode.replaceChild(clone, container);
      // Re-init canvas
      const newCanvas = document.getElementById('particle-canvas');
      const newCtx = newCanvas.getContext('2d');
      newCanvas.width = newCanvas.parentElement.clientWidth;
      newCanvas.height = newCanvas.parentElement.clientHeight;
    }
  </script>
</body>
</html>
