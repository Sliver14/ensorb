<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scene 5: Invitations & RSVP - Simplified</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050308;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .scene-container {
      position: relative;
      width: 100vw;
      max-width: 540px;
      height: 100vh;
      max-height: 960px;
      aspect-ratio: 9 / 16;
      background: radial-gradient(circle at 50% 20%, #1f0b29 0%, #0d0413 55%, #050109 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 44px 20px 36px;
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9);
    }

    .ambient-glow {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, transparent 70%);
      filter: blur(55px);
      pointer-events: none;
    }

    .header-box {
      position: relative;
      z-index: 10;
      text-align: center;
      margin-bottom: 12px;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #E9D5FF;
      margin-bottom: 8px;
    }

    .headline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #FFFFFF 0%, #F5F3FF 50%, #C084FC 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    /* Envelope & RSVP Features */
    .features-strip {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
      margin-bottom: 16px;
    }

    .feature-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      color: #E9D5FF;
    }

    /* Central Phone Mockup */
    .phone-container {
      position: relative;
      z-index: 5;
      width: 250px;
      height: 520px;
      background: #09090b;
      border: 3.5px solid #27272a;
      border-radius: 34px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.85), 0 0 40px rgba(168, 85, 247, 0.25);
      overflow: hidden;
    }

    .phone-notch {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 14px;
      background: #000;
      border-radius: 12px;
      z-index: 10;
    }

    .phone-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom-tag {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 999px;
    }
  </style>
</head>
<body>

  <div class="scene-container">
    <div class="ambient-glow"></div>

    <div class="header-box">
      <div class="category-badge">
        <span>✉️</span> Guest Attendance & Passes
      </div>
      <h1 class="headline">Invitations & RSVPs, Simplified</h1>
    </div>

    <div class="features-strip">
      <div class="feature-chip">
        <span>💌</span> Email Invites
      </div>
      <div class="feature-chip">
        <span>⚡</span> Instant Confirmation
      </div>
      <div class="feature-chip">
        <span>🎫</span> Digital Pass
      </div>
    </div>

    <!-- Phone Mockup with Real Screen Recording -->
    <div class="phone-container">
      <div class="phone-notch"></div>
      <video class="phone-video" src="../screen_recordings/scene5_rsvp_invitations.mp4" autoplay loop muted playsinline></video>
    </div>

    <div class="bottom-tag">
      <span>✨</span> Frictionless RSVP management for couples & planners
    </div>
  </div>

</body>
</html>
