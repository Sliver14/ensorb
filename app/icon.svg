<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1F36" />
      <stop offset="50%" stop-color="#6B1D2F" />
      <stop offset="100%" stop-color="#4A121F" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D0C5" />
      <stop offset="50%" stop-color="#E8A598" />
      <stop offset="100%" stop-color="#D48B7E" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Shape -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Luxury Crest Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6" />
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 6" />

  <!-- Corner Diamond Accents -->
  <g fill="url(#goldGrad)" opacity="0.75">
    <circle cx="56" cy="56" r="4" />
    <circle cx="456" cy="56" r="4" />
    <circle cx="56" cy="456" r="4" />
    <circle cx="456" cy="456" r="4" />
  </g>

  <!-- Central Crest Group -->
  <g filter="url(#subtleGlow)">
    <!-- Top Crown / Diamond Star -->
    <path d="M256 95 L263 115 L283 122 L263 129 L256 149 L249 129 L229 122 L249 115 Z" fill="url(#goldGrad)" />

    <!-- Monogram Letters "E" & "S" -->
    <!-- E Letter -->
    <text x="195" y="315" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-size="210" 
          font-weight="400" 
          fill="#FDFCF9" 
          text-anchor="middle"
          letter-spacing="-0.05em">E</text>

    <!-- Intertwined Ampersand Accent -->
    <text x="256" y="280" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-size="90" 
          font-style="italic"
          font-weight="300" 
          fill="url(#goldGrad)" 
          text-anchor="middle"
          opacity="0.9">&amp;</text>

    <!-- S Letter -->
    <text x="318" y="315" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-size="210" 
          font-weight="400" 
          fill="#FDFCF9" 
          text-anchor="middle"
          letter-spacing="-0.05em">S</text>

    <!-- Subtitle Banner: ENSORB -->
    <text x="256" y="390" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-size="32" 
          font-weight="400" 
          letter-spacing="0.32em" 
          fill="url(#goldGrad)" 
          text-anchor="middle">ENSORB</text>

    <!-- Decorative Underline flourishes -->
    <line x1="160" y1="416" x2="352" y2="416" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.8" />
    <polygon points="256,413 259,416 256,419 253,416" fill="url(#goldGrad)" />
  </g>
</svg>
